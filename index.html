<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Quote Generator</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f4f4f4;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
            width: 300px;
            margin: auto;
        }
        button {
            padding: 10px 20px;
            margin-top: 20px;
            border: none;
            background: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Random Quote Generator</h2>
    <p id="quote">Click button to get quote</p>
    <p id="author"></p>
    <button onclick="newQuote()">New Quote</button>
</div>

<script>
    const quotes = [
        {text: "Success is not final, failure is not fatal.", author: "Winston Churchill"},
        {text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt"},
        {text: "Do what you can with what you have.", author: "Theodore Roosevelt"},
        {text: "Dream big and dare to fail.", author: "Norman Vaughan"},
        {text: "Hard work beats talent when talent doesn’t work hard.", author: "Tim Notke"}
    ];

    function newQuote() {
        let random = Math.floor(Math.random() * quotes.length);
        document.getElementById("quote").innerText = quotes[random].text;
        document.getElementById("author").innerText = "- " + quotes[random].author;
    }
</script>

</body>
</html>
